# CryoPredict Multi-Container Production Compose

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cryopredict-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://127.0.0.1,http://127.0.0.1:80,http://localhost:5173,http://127.0.0.1:5173
      - CRYOPREDICT_REPO_ROOT=/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - cryonet

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: cryopredict-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    networks:
      - cryonet

networks:
  cryonet:
    driver: bridge
